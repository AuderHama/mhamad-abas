<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lab Glass — Mohammad Abbas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles/shared.css" />
  <style>
    :root {
      --bg: #eef7f6;
      --ink: #0b2e2b;
      --muted: #3d6b66;
      --accent: #0d9488;
      --glass: rgba(255,255,255,0.55);
    }
    body {
      font-family: "Manrope", sans-serif;
      color: var(--ink);
      background:
        linear-gradient(160deg, #dff3f0 0%, #eef7f6 40%, #d4ebe8 100%);
      min-height: 100vh;
    }
    .hero {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      position: relative;
      overflow: hidden;
    }
    .hero-visual {
      position: relative;
      min-height: 55vh;
      background:
        radial-gradient(circle at 70% 30%, rgba(13,148,136,0.2), transparent 50%),
        url("../assets/teacher.jpg") center 20% / cover no-repeat;
    }
    .hero-visual::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent 40%, rgba(238,247,246,0.85) 100%);
    }
    .blob {
      position: absolute;
      width: 280px; height: 280px;
      border-radius: 40% 60% 55% 45%;
      background: rgba(13,148,136,0.18);
      filter: blur(2px);
      animation: float 8s ease-in-out infinite;
      z-index: 1;
    }
    .blob.a { top: 12%; left: 8%; }
    .blob.b { bottom: 18%; right: 10%; animation-delay: -3s; width: 180px; height: 180px; }
    .copy {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(1.5rem, 5vw, 4rem);
      position: relative;
      z-index: 2;
      animation: fadeUp 0.8s ease both;
    }
    .brand {
      font-family: "Instrument Serif", Georgia, serif;
      font-size: clamp(2.8rem, 7vw, 5rem);
      line-height: 0.95;
      margin-bottom: 0.6rem;
    }
    .brand span { display: block; font-style: italic; color: var(--accent); font-size: 0.55em; }
    .lead {
      font-size: 1.1rem;
      color: var(--muted);
      max-width: 28rem;
      margin-bottom: 1.75rem;
      line-height: 1.55;
    }
    .glass-panel {
      background: var(--glass);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,0.7);
      border-radius: 1.25rem;
      padding: 1.25rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem;
      margin-bottom: 1.25rem;
      animation: fadeUp 0.9s ease 0.15s both;
    }
    .molecule {
      position: absolute;
      right: 8%;
      bottom: 12%;
      width: 120px;
      opacity: 0.35;
      animation: spinSlow 30s linear infinite;
    }
    @media (max-width: 860px) {
      .hero { grid-template-columns: 1fr; }
      .hero-visual { min-height: 48vh; order: -1; }
      .hero-visual::after {
        background: linear-gradient(180deg, transparent 35%, rgba(238,247,246,0.95) 100%);
      }
    }
  </style>
</head>
<body>
  <a class="back" href="../index.html">← All designs</a>
  <section class="hero">
    <div class="copy">
      <p class="tag">Biology · زیندەزانی</p>
      <h1 class="brand">Mohammad <span>Abbas</span></h1>
      <p class="lead">Clear lessons in genetics, cells, and life science — recorded for students who want to understand, not memorize.</p>
      <div class="glass-panel socials" data-socials></div>
      <a class="phone" href="tel:+9647701528398">0770 152 8398</a>
    </div>
    <div class="hero-visual" role="img" aria-label="Mohammad Abbas">
      <div class="blob a" aria-hidden="true"></div>
      <div class="blob b" aria-hidden="true"></div>
      <svg class="molecule" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="20" r="8" fill="#0d9488"/>
        <circle cx="20" cy="70" r="8" fill="#0d9488"/>
        <circle cx="80" cy="70" r="8" fill="#0d9488"/>
        <circle cx="50" cy="55" r="10" fill="#134e4a"/>
        <line x1="50" y1="20" x2="50" y2="55" stroke="#0d9488" stroke-width="3"/>
        <line x1="20" y1="70" x2="50" y2="55" stroke="#0d9488" stroke-width="3"/>
        <line x1="80" y1="70" x2="50" y2="55" stroke="#0d9488" stroke-width="3"/>
      </svg>
    </div>
  </section>
  <script src="../scripts/socials.js"></script>
</body>
</html>
