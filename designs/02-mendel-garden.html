<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mendel Garden — Mohammad Abbas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles/shared.css" />
  <style>
    :root {
      --leaf: #2f6b3a;
      --moss: #1f4d2a;
      --petal: #f3efe4;
      --pod: #8fbc6b;
    }
    body {
      font-family: "Source Sans 3", sans-serif;
      color: var(--moss);
      background:
        radial-gradient(ellipse at 20% 0%, #c8e0b8 0%, transparent 45%),
        radial-gradient(ellipse at 90% 80%, #a8c98c 0%, transparent 40%),
        linear-gradient(180deg, #e8f0dc, #d5e5c4);
      min-height: 100vh;
    }
    .hero {
      min-height: 100vh;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: clamp(1.5rem, 5vw, 4rem);
      overflow: hidden;
    }
    .hero-photo {
      position: absolute;
      inset: 0;
      background: url("../assets/teacher.jpg") center 15% / cover no-repeat;
      filter: saturate(0.85) contrast(1.05);
    }
    .hero-photo::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(31,77,42,0.15) 0%, rgba(31,77,42,0.55) 45%, rgba(20,50,28,0.92) 100%),
        repeating-linear-gradient(90deg, transparent, transparent 48px, rgba(143,188,107,0.08) 48px, rgba(143,188,107,0.08) 49px);
    }
    .vines {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle at 8% 70%, rgba(143,188,107,0.35) 0 18px, transparent 19px),
        radial-gradient(circle at 92% 30%, rgba(143,188,107,0.3) 0 14px, transparent 15px),
        radial-gradient(circle at 85% 75%, rgba(47,107,58,0.4) 0 10px, transparent 11px);
      animation: drift 12s ease-in-out infinite alternate;
    }
    .content {
      position: relative;
      z-index: 2;
      color: #f7faf3;
      max-width: 40rem;
      animation: fadeUp 0.85s ease both;
    }
    .brand {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(3rem, 9vw, 6rem);
      line-height: 0.9;
      font-weight: 700;
    }
    .brand em {
      display: block;
      font-style: italic;
      font-weight: 600;
      font-size: 0.45em;
      letter-spacing: 0.08em;
      margin-top: 0.4rem;
      opacity: 0.9;
    }
    .lead {
      margin: 1rem 0 1.5rem;
      font-size: 1.15rem;
      max-width: 28rem;
      opacity: 0.92;
      line-height: 1.5;
    }
    .socials a {
      background: rgba(247,250,243,0.12);
      border-color: rgba(247,250,243,0.28);
      color: #f7faf3;
    }
    .socials a:hover { background: rgba(247,250,243,0.22); }
    .phone { color: #dcecc8; border-bottom-color: rgba(220,236,200,0.4); }
  </style>
</head>
<body>
  <a class="back light" href="../index.html">← All designs</a>
  <section class="hero">
    <div class="hero-photo" role="img" aria-label="Mohammad Abbas"></div>
    <div class="vines" aria-hidden="true"></div>
    <div class="content">
      <p class="tag light">Mendel’s legacy · بنەماکانی بۆماوەزانی</p>
      <h1 class="brand">Mohammad Abbas<em>Biology that grows with you</em></h1>
      <p class="lead">From pea plants to modern genetics — lessons rooted in clarity, patience, and real understanding.</p>
      <div class="socials" data-socials></div>
      <a class="phone" href="tel:+9647701528398">0770 152 8398</a>
    </div>
  </section>
  <script src="../scripts/socials.js"></script>
</body>
</html>
