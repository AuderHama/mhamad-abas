<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DNA Blueprint — Mohammad Abbas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles/shared.css" />
  <style>
    body {
      font-family: "IBM Plex Sans", sans-serif;
      color: #0c2d4a;
      background: #d6e6f5;
      min-height: 100vh;
    }
    .sheet {
      min-height: 100vh;
      background-image:
        linear-gradient(rgba(29,111,184,0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(29,111,184,0.08) 1px, transparent 1px);
      background-size: 28px 28px;
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      position: relative;
    }
    .copy {
      padding: clamp(2rem, 6vw, 5rem);
      display: flex;
      flex-direction: column;
      justify-content: center;
      animation: fadeUp 0.8s ease both;
    }
    .meta {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #1d6fb8;
      margin-bottom: 1rem;
    }
    .brand {
      font-size: clamp(2.4rem, 6vw, 4.2rem);
      font-weight: 700;
      line-height: 1.05;
      text-transform: uppercase;
      letter-spacing: -0.02em;
    }
    .brand span {
      display: block;
      color: #1d6fb8;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.35em;
      letter-spacing: 0.2em;
      margin-top: 0.5rem;
    }
    .lead {
      margin: 1.2rem 0 1.6rem;
      max-width: 28rem;
      color: #345570;
      line-height: 1.55;
    }
    .photo-col {
      position: relative;
      border-left: 2px solid rgba(29,111,184,0.25);
      display: flex;
      align-items: stretch;
    }
    .photo-col img {
      width: 100%;
      height: 100%;
      min-height: 50vh;
      object-fit: cover;
      object-position: center 15%;
      mix-blend-mode: multiply;
      opacity: 0.92;
      filter: contrast(1.1) saturate(0.7);
      animation: fadeUp 1s ease 0.15s both;
    }
    .stamp {
      position: absolute;
      top: 2rem;
      right: 2rem;
      width: 90px;
      height: 90px;
      border: 3px solid #1d6fb8;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.65rem;
      text-align: center;
      text-transform: uppercase;
      color: #1d6fb8;
      transform: rotate(12deg);
      background: rgba(214,230,245,0.7);
      animation: spinSlow 40s linear infinite;
    }
    .helix {
      position: absolute;
      left: 2rem;
      bottom: 2rem;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.7rem;
      color: rgba(29,111,184,0.55);
      letter-spacing: 0.3em;
      animation: drift 8s ease-in-out infinite alternate;
    }
    .socials a {
      border-radius: 0;
      border-color: #1d6fb8;
      color: #0c2d4a;
      background: transparent;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.78rem;
      text-transform: uppercase;
    }
    .socials a:hover { background: #1d6fb8; color: #fff; }
    @media (max-width: 800px) {
      .sheet { grid-template-columns: 1fr; }
      .photo-col { border-left: none; border-top: 2px solid rgba(29,111,184,0.25); order: -1; max-height: 45vh; }
    }
  </style>
</head>
<body>
  <a class="back" href="../index.html">← All designs</a>
  <section class="sheet">
    <div class="copy">
      <p class="meta">Spec · BIO / GENETICS / v12</p>
      <h1 class="brand">Mohammad Abbas<span>Biology Instructor</span></h1>
      <p class="lead">Precision teaching for DNA, inheritance, and living systems — drafted like a blueprint students can build from.</p>
      <div class="socials" data-socials></div>
      <a class="phone" href="tel:+9647701528398">0770 152 8398</a>
      <p class="helix" aria-hidden="true">A—T · G—C · A—T · G—C · A—T</p>
    </div>
    <div class="photo-col">
      <img src="../assets/teacher.jpg" alt="Mohammad Abbas" />
      <div class="stamp">Approved<br/>Lesson<br/>Plan</div>
    </div>
  </section>
  <script src="../scripts/socials.js"></script>
</body>
</html>
