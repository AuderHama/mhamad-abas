<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Creator Studio — Mohammad Abbas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles/shared.css" />
  <style>
    body {
      font-family: "Work Sans", sans-serif;
      color: #111;
      background: #0a0a0a;
      min-height: 100vh;
    }
    .stage {
      min-height: 100vh;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      padding: clamp(1.5rem, 5vw, 3.5rem);
    }
    .bg {
      position: absolute;
      inset: 0;
      background: url("../assets/teacher.jpg") center 18% / cover no-repeat;
      transform: scale(1.04);
      animation: slowZoom 18s ease-in-out infinite alternate;
    }
    .bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(10,10,10,0.2) 0%, rgba(10,10,10,0.55) 40%, rgba(10,10,10,0.92) 100%),
        radial-gradient(circle at 80% 20%, rgba(225,29,72,0.25), transparent 40%);
    }
    .rec {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      z-index: 3;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: #fff;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .rec i {
      width: 10px; height: 10px;
      background: #e11d48;
      border-radius: 50%;
      animation: pulse 1.2s ease infinite;
    }
    .content {
      position: relative;
      z-index: 2;
      color: #fff;
      max-width: 42rem;
      animation: fadeUp 0.8s ease both;
    }
    .brand {
      font-family: "Syne", sans-serif;
      font-weight: 800;
      font-size: clamp(2.8rem, 8vw, 5.5rem);
      line-height: 0.92;
      letter-spacing: -0.03em;
    }
    .lead {
      margin: 1rem 0 1.5rem;
      font-size: 1.1rem;
      opacity: 0.85;
      max-width: 28rem;
      line-height: 1.5;
    }
    .cta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }
    .cta {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.85rem 1.25rem;
      background: #e11d48;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      border-radius: 999px;
      transition: transform 0.2s ease, background 0.2s;
    }
    .cta:hover { transform: translateY(-2px); background: #be123c; }
    .cta.ghost {
      background: transparent;
      border: 1.5px solid rgba(255,255,255,0.4);
    }
    .cta.ghost:hover { background: rgba(255,255,255,0.1); }
    .socials a {
      background: rgba(255,255,255,0.08);
      border-color: rgba(255,255,255,0.2);
      color: #fff;
      border-radius: 999px;
    }
    .phone { color: #fda4af; }
  </style>
</head>
<body>
  <a class="back light" href="../index.html">← All designs</a>
  <section class="stage">
    <div class="bg" role="img" aria-label="Mohammad Abbas"></div>
    <div class="rec"><i></i> Live lessons</div>
    <div class="content">
      <p class="tag light">YouTube · TikTok · Facebook</p>
      <h1 class="brand">Mohammad Abbas</h1>
      <p class="lead">Biology content that actually sticks — short explainers, full lessons, and exam-ready clarity for grade 12 and beyond.</p>
      <div class="cta-row">
        <a class="cta" href="https://www.youtube.com/@mohammd_abbas" target="_blank" rel="noopener">Watch on YouTube</a>
        <a class="cta ghost" href="https://www.tiktok.com/@mohammad_abbas_bio12" target="_blank" rel="noopener">Follow on TikTok</a>
      </div>
      <div class="socials" data-socials></div>
      <a class="phone" href="tel:+9647701528398">0770 152 8398</a>
    </div>
  </section>
  <script src="../scripts/socials.js"></script>
</body>
</html>
