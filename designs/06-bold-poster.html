<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bold Poster — Mohammad Abbas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Archivo:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles/shared.css" />
  <style>
    body {
      font-family: "Archivo", sans-serif;
      color: #111;
      background: #f6b73c;
      min-height: 100vh;
    }
    .poster {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: clamp(1rem, 3vw, 2rem);
      position: relative;
      overflow: hidden;
    }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      animation: fadeUp 0.6s ease both;
    }
    .top p {
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 0.8rem;
    }
    .mid {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 1rem;
      align-items: end;
      position: relative;
    }
    .mega {
      font-family: "Bebas Neue", sans-serif;
      font-size: clamp(4.5rem, 16vw, 11rem);
      line-height: 0.82;
      letter-spacing: 0.01em;
      animation: fadeUp 0.7s ease 0.05s both;
    }
    .mega span {
      display: block;
      color: #fff;
      -webkit-text-stroke: 2px #111;
      paint-order: stroke fill;
    }
    .photo {
      width: 100%;
      max-width: 380px;
      justify-self: end;
      aspect-ratio: 3/4;
      object-fit: cover;
      border: 4px solid #111;
      animation: fadeUp 0.8s ease 0.12s both;
      transform: rotate(2deg);
    }
    .bar {
      background: #111;
      color: #f6b73c;
      padding: 1rem 1.25rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-top: 1.5rem;
      animation: fadeUp 0.8s ease 0.2s both;
    }
    .bar .lead {
      max-width: 28rem;
      font-size: 0.95rem;
      line-height: 1.4;
    }
    .socials a {
      background: #f6b73c;
      border-color: #f6b73c;
      color: #111;
      border-radius: 0;
      font-weight: 700;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.06em;
    }
    .socials a:hover { background: #fff; border-color: #fff; }
    .phone {
      color: #111;
      font-weight: 700;
      border-bottom: 3px solid #111;
      margin-top: 1rem;
      display: inline-block;
    }
    .slash {
      position: absolute;
      width: 180%;
      height: 18px;
      background: #111;
      top: 42%;
      left: -20%;
      transform: rotate(-8deg);
      opacity: 0.08;
      pointer-events: none;
    }
    @media (max-width: 760px) {
      .mid { grid-template-columns: 1fr; }
      .photo { max-width: 240px; justify-self: start; }
    }
  </style>
</head>
<body>
  <a class="back" href="../index.html">← All designs</a>
  <section class="poster">
    <div class="top">
      <p>Biology Teacher</p>
      <p dir="rtl">محمد عباس · زیندەزانی</p>
    </div>
    <div class="mid">
      <div>
        <h1 class="mega">MOHAMMAD<span>ABBAS</span></h1>
        <a class="phone" href="tel:+9647701528398">0770 152 8398</a>
      </div>
      <img class="photo" src="../assets/teacher.jpg" alt="Mohammad Abbas" />
      <div class="slash" aria-hidden="true"></div>
    </div>
    <div class="bar">
      <p class="lead">Big ideas. Simple explanations. Genetics, cells, and life science for students who want results.</p>
      <div class="socials" data-socials></div>
    </div>
  </section>
  <script src="../scripts/socials.js"></script>
</body>
</html>
