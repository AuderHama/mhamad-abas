<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Deep Cell — Mohammad Abbas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Literata:opsz,wght@7..72,500;7..72,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles/shared.css" />
  <style>
    body {
      font-family: "Outfit", sans-serif;
      color: #e8fffb;
      background: #042f2e;
      min-height: 100vh;
    }
    .cell {
      min-height: 100vh;
      position: relative;
      overflow: hidden;
      display: grid;
      place-items: center;
      padding: 2rem;
    }
    .membrane {
      position: absolute;
      inset: -20%;
      background:
        radial-gradient(circle at 30% 40%, rgba(45,212,191,0.35) 0%, transparent 28%),
        radial-gradient(circle at 70% 60%, rgba(20,184,166,0.3) 0%, transparent 32%),
        radial-gradient(circle at 50% 20%, rgba(94,234,212,0.2) 0%, transparent 25%),
        radial-gradient(circle at 15% 80%, rgba(13,148,136,0.4) 0%, transparent 30%),
        #023333;
      animation: drift 14s ease-in-out infinite alternate;
    }
    .orb {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(153,246,228,0.25);
      animation: float 9s ease-in-out infinite;
    }
    .orb.o1 { width: 320px; height: 320px; top: 10%; left: 8%; }
    .orb.o2 { width: 180px; height: 180px; bottom: 15%; right: 12%; animation-delay: -3s; }
    .orb.o3 { width: 90px; height: 90px; top: 28%; right: 28%; animation-delay: -5s; background: rgba(45,212,191,0.12); }
    .panel {
      position: relative;
      z-index: 2;
      width: min(920px, 100%);
      display: grid;
      grid-template-columns: 0.9fr 1.1fr;
      gap: 2rem;
      align-items: center;
      animation: fadeUp 0.85s ease both;
    }
    .panel img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid rgba(153,246,228,0.35);
      box-shadow: 0 0 0 18px rgba(20,184,166,0.08), 0 30px 60px rgba(0,0,0,0.35);
    }
    .brand {
      font-family: "Literata", Georgia, serif;
      font-size: clamp(2.4rem, 6vw, 3.8rem);
      line-height: 1.05;
    }
    .lead {
      margin: 1rem 0 1.5rem;
      color: #99f6e4;
      opacity: 0.9;
      line-height: 1.55;
      max-width: 28rem;
    }
    .socials a {
      background: rgba(20,184,166,0.15);
      border-color: rgba(153,246,228,0.35);
      color: #e8fffb;
      border-radius: 999px;
    }
    .phone { color: #5eead4; }
    @media (max-width: 760px) {
      .panel { grid-template-columns: 1fr; text-align: center; }
      .panel img { max-width: 260px; margin: 0 auto; }
      .lead { margin-inline: auto; }
      .socials { justify-content: center; }
    }
  </style>
</head>
<body>
  <a class="back light" href="../index.html">← All designs</a>
  <section class="cell">
    <div class="membrane" aria-hidden="true"></div>
    <div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
    <div class="panel">
      <img src="../assets/teacher.jpg" alt="Mohammad Abbas" />
      <div>
        <p class="tag light">Inside the living world</p>
        <h1 class="brand">Mohammad Abbas</h1>
        <p class="lead">Dive into cells, systems, and the quiet architecture of life — taught with calm focus and deep clarity.</p>
        <div class="socials" data-socials></div>
        <a class="phone" href="tel:+9647701528398">0770 152 8398</a>
      </div>
    </div>
  </section>
  <script src="../scripts/socials.js"></script>
</body>
</html>
