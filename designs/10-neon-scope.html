<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Neon Scope — Mohammad Abbas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Exo+2:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles/shared.css" />
  <style>
    body {
      font-family: "Exo 2", sans-serif;
      color: #d1fae5;
      background: #050805;
      min-height: 100vh;
    }
    .scope {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr 1fr;
      position: relative;
      overflow: hidden;
    }
    .scope::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 70% 40%, rgba(57,255,20,0.12), transparent 35%),
        radial-gradient(circle at 20% 80%, rgba(34,197,94,0.1), transparent 30%),
        repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(57,255,20,0.03) 2px, rgba(57,255,20,0.03) 3px);
      pointer-events: none;
      z-index: 1;
    }
    .visual {
      position: relative;
      display: grid;
      place-items: center;
      padding: 2rem;
    }
    .ring {
      position: absolute;
      border: 2px solid rgba(57,255,20,0.35);
      border-radius: 50%;
      box-shadow: 0 0 24px rgba(57,255,20,0.15), inset 0 0 24px rgba(57,255,20,0.08);
      animation: spinSlow 20s linear infinite;
    }
    .ring.r1 { width: min(420px, 80%); aspect-ratio: 1; }
    .ring.r2 { width: min(340px, 65%); aspect-ratio: 1; animation-direction: reverse; animation-duration: 14s; border-style: dashed; }
    .ring.r3 { width: min(260px, 50%); aspect-ratio: 1; animation-duration: 10s; border-color: rgba(57,255,20,0.55); }
    .visual img {
      width: min(220px, 45%);
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid #39ff14;
      box-shadow: 0 0 40px rgba(57,255,20,0.35);
      position: relative;
      z-index: 2;
      animation: pulse 3s ease-in-out infinite;
    }
    .copy {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(1.5rem, 5vw, 4rem);
      animation: fadeUp 0.85s ease both;
    }
    .brand {
      font-family: "Orbitron", sans-serif;
      font-size: clamp(1.8rem, 4.5vw, 3rem);
      line-height: 1.15;
      color: #39ff14;
      text-shadow: 0 0 18px rgba(57,255,20,0.45);
      text-transform: uppercase;
    }
    .lead {
      margin: 1.1rem 0 1.5rem;
      color: #86efac;
      max-width: 28rem;
      line-height: 1.55;
    }
    .scan {
      font-family: "Orbitron", sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      color: rgba(57,255,20,0.7);
      margin-bottom: 0.75rem;
      animation: blink 2s step-end infinite;
    }
    .socials a {
      background: transparent;
      border-color: #39ff14;
      color: #39ff14;
      border-radius: 0;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      box-shadow: 0 0 12px rgba(57,255,20,0.15);
    }
    .socials a:hover {
      background: #39ff14;
      color: #050805;
      box-shadow: 0 0 24px rgba(57,255,20,0.45);
    }
    .phone { color: #86efac; }
    @keyframes blink {
      50% { opacity: 0.35; }
    }
    @media (max-width: 800px) {
      .scope { grid-template-columns: 1fr; }
      .visual { min-height: 45vh; padding-top: 4rem; }
    }
  </style>
</head>
<body>
  <a class="back light" href="../index.html">← All designs</a>
  <section class="scope">
    <div class="visual">
      <div class="ring r1"></div>
      <div class="ring r2"></div>
      <div class="ring r3"></div>
      <img src="../assets/teacher.jpg" alt="Mohammad Abbas" />
    </div>
    <div class="copy">
      <p class="scan">SCANNING · BIOLOGY MODULE</p>
      <h1 class="brand">Mohammad Abbas</h1>
      <p class="lead">Futuristic energy for modern science lessons — DNA, cells, and systems under the neon scope.</p>
      <div class="socials" data-socials></div>
      <a class="phone" href="tel:+9647701528398">0770 152 8398</a>
    </div>
  </section>
  <script src="../scripts/socials.js"></script>
</body>
</html>
